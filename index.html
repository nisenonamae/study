<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F3EC">
<title>勉強の場</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F3EC; --sheet:#FFFFFF; --head:#FAF8F3; --ink:#26221E; --sub:#6E665C; --rule:#DCD5C7;
  --shu:#B5432F; --shu-soft:#F5E1DC; --ok:#3D7A55; --warn:#9A6A12; --bar:#26221E; --bar-ink:#F6F3EC;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1A1815; --sheet:#232019; --head:#2A261F; --ink:#EDE7DB; --sub:#A79E90; --rule:#3B362D;
    --shu:#E07160; --shu-soft:#3A2622; --ok:#7FBF96; --warn:#D9A84A; --bar:#0F0E0C; --bar-ink:#EDE7DB; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1A1815; --sheet:#232019; --head:#2A261F; --ink:#EDE7DB; --sub:#A79E90; --rule:#3B362D;
  --shu:#E07160; --shu-soft:#3A2622; --ok:#7FBF96; --warn:#D9A84A; --bar:#0F0E0C; --bar-ink:#EDE7DB; color-scheme: dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
body{ margin:0; background:var(--paper); color:var(--ink); font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif; font-size:15px; line-height:1.7; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bar); }
h1,h2,h3{ margin:0; line-height:1.4; }
button,input,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
.num{ font-variant-numeric:tabular-nums; }

.pbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bar); color:var(--bar-ink); display:flex; align-items:center; gap:.5rem; padding:.5rem .9rem; font-size:.8rem; flex-wrap:wrap; }
.pbar .seg{ display:flex; border:1px solid rgba(255,255,255,.35); border-radius:999px; overflow:hidden; }
.pbar .seg button{ background:transparent; border:0; color:var(--bar-ink); padding:.28rem .8rem; font-size:.8rem; }
.pbar .seg button[aria-pressed="true"]{ background:var(--bar-ink); color:var(--bar); font-weight:700; }
.pbar .tag{ opacity:.75; margin-right:auto; }
.pbar .reset{ background:transparent; border:0; color:var(--bar-ink); opacity:.7; text-decoration:underline; font-size:.76rem; }

main{ max-width:640px; margin:0 auto; padding:1rem .9rem 4rem; }
.mast{ display:flex; align-items:baseline; justify-content:space-between; border-bottom:2px solid var(--ink); padding:.6rem 0 .5rem; margin-bottom:.9rem; }
.mast h1{ font-size:1.3rem; letter-spacing:.12em; }
.mast small{ color:var(--sub); font-size:.78rem; }
.sample{ font-size:.72rem; color:var(--sub); border:1px dashed var(--rule); border-radius:3px; padding:0 .35rem; }
.note{ color:var(--sub); font-size:.85rem; }

.hello{ margin:0 0 .9rem; }
.hello p{ margin:.4rem 0 0; }
.why-box{ margin-top:.8rem; border-left:3px solid var(--shu); background:var(--sheet); padding:.6rem .8rem; border-radius:0 6px 6px 0; font-size:.92rem; }

/* 国力年報と同じ形 */
.pillar{ border:1px solid var(--rule); border-radius:6px; background:var(--sheet); padding:.55rem .8rem .6rem; border-top:3px solid var(--ink); }
.pillar h2{ font-size:.82rem; letter-spacing:.12em; color:var(--sub); font-weight:700; }
.pillar .v{ font-weight:700; font-size:2.2rem; line-height:1.1; margin:.1rem 0 0; }
.pillar .d{ font-size:.82rem; } .up{ color:var(--ok); } .down{ color:var(--shu); }
.pillar .s{ font-size:.76rem; color:var(--sub); margin-top:.15rem; }
.sect{ position:relative; border:1px solid var(--rule); border-radius:6px; background:var(--sheet); margin:.7rem 0; padding:0 .8rem .75rem; overflow:hidden; }
.sect > h3{ display:flex; align-items:baseline; gap:.6rem; margin:0 -.8rem .6rem; padding:.42rem .8rem; border-bottom:1px solid var(--rule); background:var(--head); font-size:.88rem; letter-spacing:.04em; }
.sect > h3 small{ font-weight:400; font-size:.76rem; color:var(--sub); letter-spacing:0; }
.sect > h3 .r{ margin-left:auto; }
.lead{ margin:.1rem 0 .7rem; font-size:.82rem; color:var(--sub); }
.chart svg{ width:100%; height:auto; display:block; }
.chart .cap{ display:flex; justify-content:space-between; font-size:.76rem; color:var(--sub); }

/* 省のパネル(省アプリと同じ色の帯) */
.min{ border-top:3px solid var(--mc); }
.min > h3 .tm{ font-weight:700; }
.min .val{ font-weight:700; font-size:1.15rem; }
.min .desc{ margin:0 0 .5rem; font-size:.86rem; color:var(--sub); }
.min .bar{ height:6px; background:var(--rule); border-radius:3px; overflow:hidden; margin-bottom:.65rem; }
.min .bar span{ display:block; height:100%; background:var(--mc); }

.stamps{ display:flex; gap:.4rem; flex-wrap:wrap; }
.stamps button{ border:1px solid var(--rule); background:transparent; border-radius:999px; padding:.25rem .7rem; font-size:.84rem; }
.stamps button[aria-pressed="true"]{ border-color:var(--shu); background:var(--shu-soft); color:var(--shu); font-weight:700; }
@keyframes press{ from{ transform:rotate(-14deg) scale(1.6); opacity:0 } to{ transform:rotate(-14deg) scale(1); opacity:.88 } }
@media (prefers-reduced-motion: reduce){ .seal.pop{ animation:none; } }
.axes{ display:grid; gap:.55rem; }
.axis .lab{ display:flex; justify-content:space-between; font-size:.76rem; color:var(--sub); }
.axis .now{ text-align:center; font-size:.82rem; font-weight:700; min-height:1.3em; }
.axis .now.minus{ color:var(--shu); } .axis .now.plus{ color:var(--ok); } .axis .now.unset{ color:var(--rule); font-weight:400; }
.axis input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; margin:0; height:28px; background:transparent; --k:var(--ink); }
.axis input[type=range]::-webkit-slider-runnable-track{ height:4px; border-radius:2px; background:var(--rule); }
.axis input[type=range]::-moz-range-track{ height:4px; border-radius:2px; background:var(--rule); }
.axis input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:22px; height:22px; margin-top:-9px; border-radius:50%; background:var(--k); border:2px solid var(--sheet); box-shadow:0 0 0 1px var(--k); }
.axis input[type=range]::-moz-range-thumb{ width:20px; height:20px; border-radius:50%; background:var(--k); border:2px solid var(--sheet); box-shadow:0 0 0 1px var(--k); }
.axis.minus input[type=range]{ --k:var(--shu); } .axis.plus input[type=range]{ --k:var(--ok); }
.axis.unset input[type=range]{ --k:var(--rule); }
.ticks{ display:flex; justify-content:space-between; padding:0 9px; margin-top:-6px; }
.ticks i{ width:1px; height:5px; background:var(--rule); }
.ticks i:nth-child(4){ height:8px; background:var(--sub); }
.whyin{ margin-top:.55rem; }
.whyin input{ width:100%; padding:.42rem .6rem; border:1px solid var(--rule); border-radius:4px; background:var(--paper); font-size:.88rem; }

textarea{ width:100%; min-height:5em; padding:.6rem .7rem; border:1px solid var(--rule); border-radius:4px; background:var(--paper); resize:vertical; }
.btn{ border:0; border-radius:4px; padding:.55rem 1.1rem; background:var(--ink); color:var(--paper); font-weight:700; }
.btn.ghost{ background:transparent; color:var(--ink); border:1px solid var(--rule); }
.btn.sm{ padding:.35rem .85rem; font-size:.85rem; }
.saved{ font-size:.84rem; color:var(--ok); margin-left:.6rem; }
.err{ color:var(--shu); font-size:.86rem; min-height:1.3em; }

.gate{ min-height:65vh; display:flex; flex-direction:column; justify-content:center; gap:.8rem; }
.gate h1{ font-size:1.25rem; }
.gate p{ margin:0; color:var(--sub); font-size:.92rem; }
.gate input{ width:100%; max-width:320px; padding:.65rem .8rem; border:1px solid var(--rule); border-radius:4px; background:var(--sheet); font-size:1rem; }

.req{ border-top:1px dashed var(--rule); padding:.6rem 0; }
.req:first-of-type{ border-top:0; }
.req .top{ display:flex; gap:.55rem; align-items:baseline; }
.req .when{ color:var(--sub); font-size:.76rem; margin-left:auto; white-space:nowrap; }
.pill{ font-size:.74rem; border-radius:999px; padding:0 .55rem; border:1px solid currentColor; white-space:nowrap; }
.pill.new{ color:var(--sub); } .pill.doing{ color:var(--warn); } .pill.done{ color:var(--ok); }
.req .reply{ margin-top:.4rem; padding:.45rem .65rem; background:var(--paper); border-radius:4px; font-size:.88rem; }
.req .ctl{ display:flex; gap:.4rem; flex-wrap:wrap; margin-top:.5rem; }
.req .ctl input{ flex:1 1 12em; min-width:0; padding:.42rem .6rem; border:1px solid var(--rule); border-radius:4px; background:var(--paper); font-size:.88rem; }
.empty{ color:var(--sub); font-size:.9rem; padding:.4rem 0; }

[hidden]{ display:none !important; }
.tabs{ position:sticky; top:calc(env(safe-area-inset-top,0px) + 2.55rem); z-index:4; background:var(--paper); display:flex; gap:.3rem; overflow-x:auto; padding:.45rem 0 .5rem; margin:0 0 .5rem; border-bottom:1px solid var(--rule); scrollbar-width:none; }
.tabs::-webkit-scrollbar{ display:none; }
.tabs button{ flex:none; border:1px solid var(--rule); background:var(--sheet); border-radius:999px; padding:.25rem .8rem; font-size:.85rem; color:var(--sub); }
.tabs button[aria-pressed="true"]{ background:var(--ink); border-color:var(--ink); color:var(--paper); font-weight:700; }
.tabs button .n{ font-size:.72rem; margin-left:.2rem; }
.allow{ display:grid; gap:.1rem; }
.allow .g{ font-size:.76rem; color:var(--sub); font-weight:700; letter-spacing:.06em; margin:.6rem 0 .15rem; }
.allow .g:first-child{ margin-top:0; }
.sw{ all:unset; box-sizing:border-box; cursor:pointer; display:flex; align-items:center; gap:.6rem; padding:.4rem .2rem; border-radius:4px; font-size:.92rem; }
.sw:focus-visible{ outline:2px solid var(--ink); }
.sw .k{ width:2.2rem; height:1.25rem; border-radius:999px; background:var(--rule); position:relative; flex:none; transition:background .15s; }
.sw .k::after{ content:""; position:absolute; top:2px; left:2px; width:calc(1.25rem - 4px); height:calc(1.25rem - 4px); border-radius:50%; background:var(--sheet); transition:left .15s; }
.sw[aria-pressed="true"] .k{ background:var(--ok); }
.sw[aria-pressed="true"] .k::after{ left:calc(2.2rem - 1.25rem + 2px); }
.sw.sub{ padding-left:2.9rem; font-size:.84rem; color:var(--sub); }
.sw[disabled]{ opacity:.4; cursor:default; }
.swrow{ display:flex; align-items:center; gap:.4rem; }
.swrow .sw{ flex:1; min-width:0; }
.peekbtn{ flex:none; border:1px solid var(--rule); background:transparent; border-radius:4px; padding:.15rem .55rem; font-size:.78rem; color:var(--sub); }
.peekbtn[aria-expanded="true"]{ background:var(--ink); border-color:var(--ink); color:var(--paper); }
.peek{ border:1px solid var(--rule); border-left:3px solid var(--sub); border-radius:4px; padding:.5rem .7rem .55rem; margin:.15rem 0 .55rem; background:var(--paper); font-size:.88rem; }
.peek.on{ border-left-color:var(--ok); }
.peek .pl{ font-size:.72rem; color:var(--sub); font-weight:700; letter-spacing:.04em; margin-bottom:.3rem; }
.peek .slogan{ font-size:1.05rem; }
.peek .stages li{ padding:.25rem .5rem; font-size:.84rem; }
.allbtns{ display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.6rem; }
.allbtns .btn{ white-space:nowrap; }
.hidden-note{ border:1px dashed var(--rule); border-radius:6px; padding:1rem; color:var(--sub); font-size:.9rem; text-align:center; }
@media (prefers-reduced-motion: reduce){ .sw .k, .sw .k::after{ transition:none; } }
.news li{ margin:.2rem 0; }
.news{ margin:0; padding-left:1.1rem; font-size:.92rem; }
.news b{ font-weight:700; }
.q{ border-top:1px dashed var(--rule); padding:.6rem 0; }
.q:first-of-type{ border-top:0; padding-top:.1rem; }
.q .qq{ font-weight:700; font-size:.92rem; margin-bottom:.35rem; }
.q .opts{ display:flex; flex-wrap:wrap; gap:.35rem; }
.q .opts button{ border:1px solid var(--rule); background:var(--paper); border-radius:4px; padding:.3rem .7rem; font-size:.86rem; }
.q .opts button.right{ border-color:var(--ok); color:var(--ok); background:transparent; font-weight:700; }
.q .opts button.wrong{ border-color:var(--shu); color:var(--shu); text-decoration:line-through; background:transparent; }
.q .opts button[disabled]{ cursor:default; }
.q .ans{ font-size:.84rem; margin-top:.35rem; }
.bet{ display:flex; gap:.4rem; flex-wrap:wrap; }
.bet button{ flex:1; border:1px solid var(--rule); background:var(--paper); border-radius:6px; padding:.55rem; font-weight:700; }
.bet button[aria-pressed="true"]{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.rec{ display:flex; gap:.6rem; flex-wrap:wrap; font-size:.84rem; color:var(--sub); margin-top:.5rem; }
.rec b{ color:var(--ink); }
.chal-form{ display:flex; gap:.4rem; flex-wrap:wrap; margin-top:.3rem; }
.chal-form input{ flex:1 1 12em; min-width:0; padding:.45rem .6rem; border:1px solid var(--rule); border-radius:4px; background:var(--paper); }
.chal-form select{ padding:.4rem; border:1px solid var(--rule); border-radius:4px; background:var(--paper); color:var(--ink); }
.pill.prop{ color:var(--sub); } .pill.acc{ color:var(--warn); } .pill.dec{ color:var(--sub); text-decoration:line-through; } .pill.win{ color:var(--ok); } .pill.lose{ color:var(--shu); }
.badges{ display:grid; grid-template-columns:repeat(3, 1fr); gap:.45rem; }
.badge{ border:1px solid var(--rule); border-radius:6px; padding:.5rem .35rem; text-align:center; font-size:.76rem; color:var(--sub); background:var(--paper); }
.badge .i{ font-size:1.4rem; display:block; filter:grayscale(1); opacity:.35; }
.badge b{ display:block; font-size:.82rem; color:var(--sub); }
.badge.got{ border-color:var(--gold, #9A7B2F); background:var(--sheet); color:var(--ink); }
.badge.got .i{ filter:none; opacity:1; }
.badge.got b{ color:var(--ink); }
.lock{ display:flex; gap:.5rem; align-items:flex-start; border:1px solid var(--rule); border-left:3px solid var(--ink); background:var(--paper); border-radius:0 4px 4px 0; padding:.45rem .6rem; font-size:.84rem; margin:.1rem 0 .6rem; }
.lock .ic{ flex:none; }
.sealed{ display:flex; gap:.6rem; align-items:center; border:1px dashed var(--sub); border-radius:6px; padding:.55rem .7rem; margin:.4rem 0; background:var(--paper); }
.sealed .ic{ font-size:1.3rem; }
.sealed .t{ flex:1; font-size:.88rem; }
.sealed .t b{ display:block; font-size:.92rem; }
.pill.c-seal{ color:var(--ink); } .pill.c-open{ color:var(--warn); } .pill.c-win{ color:var(--ok); } .pill.c-lose{ color:var(--shu); }
.ptool{ font-size:.76rem; color:var(--sub); border:1px dashed var(--rule); border-radius:4px; background:transparent; padding:.2rem .55rem; margin-top:.5rem; }
.manual > h3{ letter-spacing:.12em; }
.manual h4{ margin:.9rem 0 .35rem; font-size:.86rem; display:flex; align-items:center; gap:.45rem; }
.manual h4::before{ content:""; width:.55rem; height:.55rem; background:var(--shu); display:inline-block; }
.manual p{ margin:0 0 .4rem; font-size:.92rem; }
.manual ol{ margin:0; padding-left:1.4rem; font-size:.92rem; }
.manual ol li{ margin:.25rem 0; }
.manual ol li b{ font-weight:700; }
.gloss{ display:grid; grid-template-columns:max-content 1fr; gap:.3rem .8rem; margin:0; font-size:.9rem; }
.gloss dt{ font-weight:700; white-space:nowrap; }
.gloss dd{ margin:0; color:var(--sub); }
.manual ul{ margin:0; padding-left:1.2rem; font-size:.88rem; color:var(--sub); }
.towrite{ display:block; margin:.4rem 0 0; border:1px dashed var(--rule); background:transparent; border-radius:6px; padding:.55rem; width:100%; font-size:.88rem; color:var(--sub); }
.ptop{ display:flex; align-items:flex-end; gap:.9rem; flex-wrap:wrap; }
.ptop .v{ font-weight:700; font-size:2.2rem; line-height:1; }
.ptop .d{ font-size:.82rem; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:.5rem; }
.tile{ all:unset; box-sizing:border-box; cursor:pointer; display:block; border:1px solid var(--rule); border-top:3px solid var(--mc); border-radius:6px; background:var(--sheet); padding:.45rem .6rem .5rem; }
.tile:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
.tile .nm{ display:flex; align-items:baseline; gap:.3rem; font-weight:700; font-size:.92rem; }
.tile .nm .pinmark{ margin-left:auto; font-size:.8rem; }
.tile .row2{ display:flex; align-items:baseline; gap:.4rem; margin:.1rem 0 .3rem; }
.tile .row2 b{ font-size:1.35rem; }
.tile .row2 small{ font-size:.76rem; color:var(--sub); }
.tile .bar{ height:4px; background:var(--rule); border-radius:2px; overflow:hidden; }
.tile .bar span{ display:block; height:100%; background:var(--mc); }
.mrow{ display:flex; gap:.6rem; align-items:flex-start; padding:.5rem 0; border-top:1px dashed var(--rule); }
.mrow:first-of-type{ border-top:0; padding-top:.1rem; }
.mrow .t{ flex:1; font-size:.88rem; }
.mrow .t b{ display:block; font-size:.92rem; }
.pin.pinsm{ margin:0; padding:0; flex:none; width:2.3rem; height:2.3rem; display:grid; place-items:center; font-size:1rem; line-height:1; border-radius:50%; }
.pins{ display:flex; gap:.4rem; flex-wrap:wrap; }
.pin{ border:1px dashed var(--rule); background:transparent; border-radius:999px; padding:.2rem .7rem; font-size:.8rem; color:var(--sub); margin-top:.55rem; }
.pin[aria-pressed="true"]{ border-style:solid; border-color:var(--shu); color:var(--shu); background:var(--shu-soft); font-weight:700; }
.write{ border-top:3px solid var(--shu); }
.write textarea{ min-height:11em; font-size:.98rem; line-height:1.75; }
.chips{ display:flex; flex-wrap:wrap; gap:.35rem; margin:.3rem 0 .2rem; }
.chips button{ border:1px solid var(--rule); background:var(--paper); border-radius:4px; padding:.25rem .6rem; font-size:.84rem; }
.chips button.p{ border-color:var(--shu); color:var(--shu); background:var(--shu-soft); }
.hint{ font-size:.8rem; color:var(--sub); margin:.7rem 0 .2rem; font-weight:700; letter-spacing:.04em; }
.count{ font-size:.76rem; color:var(--sub); text-align:right; }
.sent{ border-top:1px dashed var(--rule); padding:.5rem 0; font-size:.92rem; white-space:pre-wrap; }
.sent:first-of-type{ border-top:0; }
.sent .d{ font-size:.76rem; color:var(--sub); display:block; }
.se-vol input{ accent-color:var(--ink); }
.navrow{ display:flex; align-items:center; gap:.6rem; margin:.2rem 0 .8rem; }
.back{ border:1px solid var(--rule); background:var(--sheet); border-radius:4px; padding:.3rem .8rem; font-size:.85rem; }
.minlist button{ all:unset; box-sizing:border-box; display:block; width:100%; cursor:pointer; }
.minlist .sect.min{ margin:.55rem 0; }
.minlist .go{ font-size:.8rem; color:var(--sub); margin-top:.35rem; }
.minlist button:focus-visible .sect{ outline:2px solid var(--ink); outline-offset:2px; }
.purpose{ font-size:.95rem; margin:.1rem 0 .7rem; }
.stages{ list-style:none; margin:0; padding:0; display:grid; gap:.35rem; }
.stages li{ display:flex; gap:.6rem; align-items:baseline; padding:.4rem .6rem; border:1px solid var(--rule); border-radius:4px; font-size:.9rem; }
.stages li .st{ font-size:.74rem; border-radius:999px; padding:0 .5rem; border:1px solid currentColor; white-space:nowrap; }
.stages li.done{ color:var(--sub); } .stages li.done .st{ color:var(--ok); }
.stages li.now{ border-color:var(--mc,var(--ink)); border-width:2px; } .stages li.now .st{ color:var(--mc,var(--ink)); font-weight:700; }
.stages li.next .st{ color:var(--sub); }
.wave{ border-left:3px solid var(--mc,var(--ink)); padding:.35rem .7rem; background:var(--paper); border-radius:0 4px 4px 0; font-size:.92rem; }
.tasks{ display:flex; flex-wrap:wrap; gap:.35rem; }
.tasks span{ font-size:.82rem; border:1px solid var(--rule); border-radius:4px; padding:.1rem .5rem; background:var(--paper); }
.sub-h{ font-size:.8rem; color:var(--sub); font-weight:700; letter-spacing:.06em; margin:.8rem 0 .35rem; }
.goal{ display:flex; gap:.6rem; align-items:center; font-size:.9rem; padding:.3rem 0; }
.goal .gbar{ flex:1; height:6px; background:var(--rule); border-radius:3px; overflow:hidden; }
.goal .gbar span{ display:block; height:100%; background:var(--ok); }
.slogan{ font-size:1.25rem; font-weight:700; letter-spacing:.06em; margin:.1rem 0 .3rem; }
.feat{ display:flex; gap:.6rem; align-items:baseline; padding:.35rem 0; border-top:1px dashed var(--rule); font-size:.92rem; }
.feat:first-of-type{ border-top:0; }

<body>
<main id="app"></main>
<footer style="max-width:640px;margin:0 auto;padding:0 .9rem 2rem"><span id="se-anchor"></span></footer>
<div class="toast" id="toast" role="status" hidden></div>
<script>
/* ═══════════ 勉強の場(本番) ═══════════
   データは非公開リポジトリの study.json に保存。鍵は招待リンクの # の後ろに入っていて、ページ本体には書かない。
   リアルタイムではない:45秒ごとに読み直す。書き込むときは、最新を読んでから書く(ぶつかったら読み直して書き直す) */
const APP_VERSION = "2026-10-25 s3";
const SUBJECTS = ["数学", "英語", "国語", "理科", "社会", "その他"];
const CONF_KEY = "study-conf";
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let conf = lsGet(CONF_KEY, null);   // { repo, token, branch, me }
const blankData = () => ({ version: 1, admin: null, linkVer: 1, members: [], qs: [], probs: [], books: [], bookLog: [], battles: [], room: { on: {}, log: [] }, presets: [], grants: {}, fb: [], ownerPub: null, sysAt: 0, events: [] });
let S = blankData(), sha = null, loaded = false, loadErr = "", busy = false;

/* ───── GitHub ───── */
const b64enc = s => { const b = new TextEncoder().encode(s); let bin = ""; b.forEach(x => bin += String.fromCharCode(x)); return btoa(bin); };
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, "")), c => c.charCodeAt(0)));
async function gh(path, opts){
  opts = opts || {};
  const r = await fetch("https://api.github.com/repos/" + conf.repo + "/contents/" + path + (opts.method ? "" : "?ref=" + (conf.branch || "main") + "&t=" + Date.now()), {
    method: opts.method || "GET", headers: { Authorization: "Bearer " + conf.token, Accept: "application/vnd.github+json", "Content-Type": "application/json" }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  return r;
}
async function load(){
  const r = await gh("study.json");
  if (r.status === 404) { S = blankData(); sha = null; loaded = true; return; }
  if (r.status === 401 || r.status === 403) throw new Error("鍵が使えない(招待リンクが古いか、鍵の期限が切れている)");
  if (!r.ok) throw new Error("読み込めない(" + r.status + ")");
  const j = await r.json(); S = Object.assign(blankData(), JSON.parse(b64dec(j.content))); sha = j.sha; loaded = true;
}
/* 最新を読んで、変更を当てて、書く。ぶつかったらやり直す */
async function mutate(fn, msg){
  if (busy) return false; busy = true;
  try {
    for (let i = 0; i < 4; i++) {
      await load(); const res = fn(S); if (res === false) return false;
      const r = await gh("study.json", { method: "PUT", body: { message: msg || "勉強の場", content: b64enc(JSON.stringify(S)), branch: conf.branch || "main", ...(sha ? { sha } : {}) } });
      if (r.ok) { sha = (await r.json()).content.sha; return true; }
      if (r.status !== 409 && r.status !== 422) throw new Error("書き込めない(" + r.status + ")");
      await new Promise(z => setTimeout(z, 300 + Math.random() * 500));
    }
    throw new Error("ほかの人と同時に書き込みがぶつかった。もう一度押して");
  } catch (e) { toast(e.message); return false; }
  finally { busy = false; }
}

/* ───── ふつうの道具 ───── */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
async function hash(s, salt){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("study:" + salt + ":" + s)); return Array.from(new Uint8Array(b), x => x.toString(16).padStart(2, "0")).join(""); }
const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? "今" : m < 60 ? m + "分前" : m < 1440 ? Math.round(m / 60) + "時間前" : Math.round(m / 1440) + "日前"; };
const md = t => { const d = new Date(t); return (d.getMonth() + 1) + "/" + d.getDate(); };
const me = () => conf && conf.me;
const nameBy = id => ((S.members.find(x => x.id === id) || {}).name || "だれか");
const isAdmin = () => !!me() && S.admin === me();
const snd = n => { if (window.SE) SE.play(n); };
function toast(t){ const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => { el.hidden = true; }, 3200); }

/* ───── 画面の状態 ───── */
let tab = lsGet("study-tab", "guide"), gateErr = "", openQ = null, randPick = null, roomPlan = 50, playing = null, viewing = null;
const mins = t => Math.max(0, Math.floor((Date.now() - t) / 60000));
const dayStart = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
const liveRoom = () => Object.fromEntries(Object.entries(S.room.on || {}).filter(([, v]) => Date.now() - v.start < 4 * 3600e3));   // 4時間以上たったものは終わったことにする

/* ═════ はじめて(管理者の設定)・招待から入る・合言葉 ═════ */
function setupScreen(){
  return '<div class="gate"><h1>勉強の場をはじめる</h1><p>最初の1回だけ。データを置く非公開リポジトリと、そこだけを読み書きできる鍵を入れる。ここで設定した人が管理者になる。</p>' +
    '<input id="srepo" placeholder="ユーザー名/study-data" aria-label="リポジトリ"><input id="stoken" type="password" placeholder="鍵(トークン)" aria-label="鍵"><input id="sbranch" placeholder="ブランチ(空なら main)" aria-label="ブランチ">' +
    '<div class="err" role="alert">' + esc(gateErr) + '</div><div><button type="button" class="btn" id="setupgo">つなぐ</button></div>' +
    '<p class="note">招待リンクから来た人は、この画面ではなく、入る画面が出る。</p></div>';
}
function joinScreen(){
  const has = S.members.length > 0;
  return '<div class="gate"><h1>' + (S.admin ? "勉強の場に招待されたよ" : "最初のメンバーとして入る") + '</h1><p>勉強の質問をしたり、問題を出し合ったり、一緒に勉強したりする場所。</p>' +
    '<input id="jname" placeholder="ここで使う名前" aria-label="名前"><input id="p1" type="password" placeholder="合言葉(自分だけのもの)" aria-label="合言葉"><input id="p2" type="password" placeholder="合言葉をもう一回" aria-label="合言葉をもう一回">' +
    '<div class="err" role="alert">' + esc(gateErr) + '</div><div><button type="button" class="btn" id="joinbtn">入る</button></div>' +
    (has ? '<div class="sub-h" style="margin-top:1.2rem">前に入ったことがある</div><div class="chal-form"><select id="lname" aria-label="名前">' + S.members.map(m => '<option value="' + m.id + '">' + esc(m.name) + "</option>").join("") + '</select><input id="lpass" type="password" placeholder="合言葉" aria-label="合言葉"><button type="button" class="btn ghost sm" id="loginbtn">入る</button></div>' : "") + "</div>";
}

/* ═════ 説明書 ═════ */
function guide(){
  return '<div class="sect manual"><h3>説明書<small>勉強の場</small></h3>' +
    '<h4>これは何</h4><p>勉強の質問をしたり、問題を出し合ったり、一緒に勉強したりする場所。学校で忙しくても、休み時間の数分で使えるように作ってる。</p>' +
    '<h4>使い方</h4><ol><li><b>作業部屋</b>で「今から勉強する」を押すと、ほかの人に勉強中だと伝わる。<b>勉強会</b>の予定もここにある</li><li><b>勝負</b>で、だれかの募集に入ると勝負できる。自分で募集もできる</li>' +
      '<li><b>質問板</b>に分からない問題を書く。気づいた人があとで答える</li><li><b>問題</b>で、今日の1問や、みんなの問題集からランダムな1問を解く</li><li><b>出す</b>で、問題を出したり、自分の問題集を登録したりする</li></ol>' +
    '<h4>リアルタイムではない</h4><p>ほかの人が書いたことや打った手は、<b>だいたい1分以内</b>にこっちの画面に出る。すぐには出ないので、勝負はどれも「自分の空いた時間に進める」形になってる。同じ時間にいなくていい。</p>' +
    '<h4>ここにいる人</h4><div class="tasks">' + S.members.map(m => "<span>" + esc(m.name) + "</span>").join("") + "</div>" +
    '<h4>友達を呼ぶ</h4><p>このリンクを送れば、だれでも入れる。</p><div class="chal-form"><input id="invlink" readonly value="' + esc(inviteLink()) + '" aria-label="招待リンク"><button type="button" class="btn sm" id="copylink">コピー</button></div>' +
    '<p class="note" style="margin:.35rem 0 0">送るときの例:「勉強の質問とか問題を出し合う場所。よかったら入って」</p>' +
    '<h4>知っておいてほしいこと</h4><ul><li>書いたものは、ここにいる人全員に見える</li><li>勉強の記録(作業部屋の時間・解いた問題・勝負など)は、管理者の' + esc(nameBy(S.admin)) + 'がまとめて見られる。みんなで続けるために使う</li><li>招待リンクを知っている人なら、だれでも入れる。知らない人には送らないで</li><li>合言葉は自分だけのもの。ほかの人は君として入れない</li></ul></div>';
}
function inviteLink(){ if (!conf) return ""; const k = btoa(JSON.stringify({ r: conf.repo, t: conf.token, b: conf.branch || "main", f: conf.me || null })).replace(/=+$/, ""); return location.origin + location.pathname + "#k=" + k; }

/* ═════ 作業部屋 ═════ */
function room(){
  const on = liveRoom(), mine = on[me()], others = Object.entries(on).filter(([k]) => k !== me());
  const sum = {}; (S.room.log || []).filter(x => x.end >= dayStart()).forEach(x => { sum[x.who] = (sum[x.who] || 0) + Math.round((x.end - Math.max(x.start, dayStart())) / 60000); });
  Object.entries(on).forEach(([k, v]) => { sum[k] = (sum[k] || 0) + mins(Math.max(v.start, dayStart())); });
  return eventsHtml() + '<div class="sect"><h3>作業部屋<small>' + Object.keys(on).length + '人が勉強中</small></h3>' +
    (mine ? '<div class="room-me"><div class="tm" data-since="' + mine.start + '">' + mins(mine.start) + '分</div><div class="what">' + esc(mine.sub) + (mine.what ? "・" + esc(mine.what) : "") + (mine.plan ? " ・ 目安 " + mine.plan + "分" : "") + '</div></div><div style="text-align:center;margin-top:.5rem"><button type="button" class="btn" id="roomend">おわり</button></div>'
      : '<p class="lead">始めると、ほかの人の画面に「勉強中」と出る。だれかが続けてると、やめにくい。</p><div class="chal-form"><select id="roomsub" aria-label="科目">' + SUBJECTS.map(x => "<option>" + x + "</option>").join("") + '</select><input id="roomwhat" placeholder="なにをやる?(書かなくてもOK)" aria-label="なにをやるか"></div>' +
        '<div class="plans" role="group" aria-label="目安の時間">' + [25, 50, 90, 0].map(n => '<button type="button" data-plan="' + n + '" aria-pressed="' + (roomPlan === n) + '">' + (n ? n + "分" : "決めない") + "</button>").join("") + '</div><button type="button" class="btn" id="roomstart">今から勉強する</button>') + "</div>" +
    '<div class="sect"><h3>いま勉強中の人</h3>' + (others.length ? others.map(([k, v]) => '<div class="who"><span class="dot" aria-hidden="true"></span><span class="nm">' + esc(nameBy(k)) + "</span><span>" + esc(v.sub) + (v.what ? "・" + esc(v.what) : "") + '</span><span class="r" data-since="' + v.start + '">' + mins(v.start) + "分</span></div>").join("") : '<p class="empty">いまはだれもいない。</p>') +
      (others.length && !mine ? '<div style="margin-top:.4rem"><button type="button" class="btn ghost sm" id="roomjoin">一緒にやる</button></div>' : "") + "</div>" +
    '<div class="sect"><h3>今日の勉強時間</h3>' + (Object.keys(sum).length ? '<div class="today-sum">' + Object.entries(sum).sort((a, b) => b[1] - a[1]).map(([k, v]) => "<span>" + esc(nameBy(k)) + " <b>" + v + "分</b></span>").join("") + "</div>" : '<p class="empty">まだ記録がない。</p>') + "</div>";
}

/* ═════ 質問板 ═════ */
function qCard(q){
  const open = openQ === q.id, mine = q.by === me();
  return '<div class="req"><div class="top"><span class="pill ' + (q.solved ? "done" : "doing") + '">' + esc(q.sub) + (q.solved ? "・解決" : "") + "</span><span>" + esc(q.text) + "</span></div>" +
    '<div class="note" style="margin-top:.2rem">' + esc(nameBy(q.by)) + " ・ " + ago(q.at) + " ・ 答え " + q.ans.length + "件</div>" +
    '<div class="ctl"><button type="button" class="btn ghost sm" data-openq="' + q.id + '">' + (open ? "閉じる" : "答えを見る・答える") + "</button>" + (mine && !q.solved && q.ans.length ? '<button type="button" class="btn ghost sm" data-solve="' + q.id + '">解決した</button>' : "") + "</div>" +
    (open ? q.ans.map(a => '<div class="reply"><b>' + esc(nameBy(a.by)) + "</b> " + esc(a.text) + '<div class="note">' + ago(a.at) + "</div></div>").join("") + '<div class="ctl"><input data-ansin="' + q.id + '" placeholder="答えを書く(途中まででもOK)" aria-label="答え"><button type="button" class="btn sm" data-ans="' + q.id + '">答える</button></div>' : "") + "</div>";
}
function board(){
  return '<div class="sect"><h3>質問を出す</h3><div class="chal-form"><select id="qsub" aria-label="科目">' + SUBJECTS.map(x => "<option>" + x + "</option>").join("") + '</select><input id="qtext" placeholder="分からないところを、そのまま書く" aria-label="質問"><button type="button" class="btn sm" id="sendq">質問する</button></div></div>' +
    '<div class="sect"><h3>質問板<small>まだ解決していない ' + S.qs.filter(q => !q.solved).length + "件</small></h3>" + (S.qs.length ? S.qs.slice().sort((a, b) => (a.solved - b.solved) || (b.at - a.at)).map(qCard).join("") : '<p class="empty">まだ質問はない。最初の1つを出してみて。</p>') + "</div>";
}

/* ═════ 問題 ═════ */
function probCard(p, big){
  const r = (p.res || {})[me()], answered = !!r, ch = p.choices || [];
  const n = Object.keys(p.res || {}).length, right = Object.values(p.res || {}).filter(x => x.ok).length;

<script>

/* 効果音(国力年報・省・行軍表などと同じ音。入/切と音量は共通) */

// ───────── 効果音(ブラウザの中で音を合成。音のファイルは使わない)─────────
// 設定(入/切・音量)は 3つのアプリで共通(localStorage の se-on / se-vol)
const SE = (() => {
  let ctx = null, master = null, lastTap = 0, lastErr = 0;
  const ls = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } };
  let on = ls("se-on", "1") !== "0", vol = Math.max(0, Math.min(1, +ls("se-vol", "0.5")));
  function ac(){
    if (!on) return null;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
    if (!ctx) { ctx = new AC(); master = ctx.createGain(); master.connect(ctx.destination); }
    if (ctx.state === "suspended") ctx.resume();
    master.gain.value = vol * 0.9;
    return ctx;
  }
  // 1つの音:周波数 f(滑らせるなら f2)、始まり t、長さ d、波の形、大きさ g
  function note(c, f, t, d, o){
    o = o || {};

    const g = o.g == null ? 0.2 : o.g, a = o.a == null ? 0.005 : o.a;
    gn.gain.setValueAtTime(0.0001, t0); gn.gain.exponentialRampToValueAtTime(g, t0 + a);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    let last = gn;
    if (o.lp) { const fl = c.createBiquadFilter(); fl.type = "lowpass"; fl.frequency.value = o.lp; gn.connect(fl); last = fl; }
    osc.connect(gn); last.connect(master); osc.start(t0); osc.stop(t0 + d + 0.05);
  }
  // 鐘のような音(基音 + 倍音)
  const bell = (c, f, t, d, g) => { note(c, f, t, d, { g: g }); note(c, f * 2, t, d * 0.6, { g: g * 0.35 }); note(c, f * 3.01, t, d * 0.3, { g: g * 0.12 }); };
  // ざわめき(風・波)

    for (let i = 0; i < n; i++) ch[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(), fl = c.createBiquadFilter(), gn = c.createGain(), t0 = c.currentTime + (t || 0);
    src.buffer = buf; fl.type = o.type || "lowpass"; fl.Q.value = o.q || 0.7;
    fl.frequency.setValueAtTime(o.f || 400, t0); if (o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2, t0 + d * 0.8);
    const g = o.g || 0.08;
    gn.gain.setValueAtTime(0.0001, t0); gn.gain.exponentialRampToValueAtTime(g, t0 + d * 0.35); gn.gain.exponentialRampToValueAtTime(0.0001, t0 + d);

  }

    tap: c => note(c, 880, 0, 0.05, { f2: 660, g: 0.05 }),
    tab: c => { note(c, 520, 0, 0.07, { type: "triangle", g: 0.07 }); note(c, 780, 0.03, 0.06, { type: "triangle", g: 0.04 }); },
    toggleOn: c => note(c, 600, 0, 0.08, { f2: 1150, g: 0.08 }),
    toggleOff: c => note(c, 900, 0, 0.08, { f2: 480, g: 0.06 }),
    done: c => { bell(c, 1046.5, 0, 0.45, 0.11); bell(c, 1318.5, 0.08, 0.6, 0.11); },
    save: c => { bell(c, 784, 0, 0.35, 0.08); bell(c, 1174.7, 0.01, 0.4, 0.06); },
    remove: c => note(c, 520, 0, 0.14, { f2: 240, type: "triangle", g: 0.08 }),
    error: c => { note(c, 220, 0, 0.09, { type: "square", g: 0.05, lp: 900 }); note(c, 196, 0.12, 0.12, { type: "square", g: 0.05, lp: 900 }); },
    open: c => noise(c, 0, 0.18, { f: 300, f2: 2400, type: "bandpass", q: 1.2, g: 0.05 }),
    fanfare: c => { [523.25, 659.25, 783.99].forEach((f, i) => { note(c, f, i * 0.09, 0.3, { type: "triangle", g: 0.12 }); note(c, f * 2, i * 0.09, 0.2, { g: 0.03 }); });
      bell(c, 1046.5, 0.27, 1.1, 0.13); note(c, 523.25, 0.27, 1.0, { type: "triangle", g: 0.06 });

    issue: c => { [392, 523.25, 659.25, 783.99].forEach((f, i) => note(c, f, i * 0.12, i === 3 ? 0.9 : 0.22, { type: "sawtooth", g: 0.07, lp: 1800, a: 0.02 }));
      note(c, 196, 0.36, 0.9, { type: "sawtooth", g: 0.04, lp: 700, a: 0.03 }); },

    pluck: c => { note(c, 880, 0, 0.35, { type: "triangle", g: 0.09, a: 0.002 }); note(c, 1318.5, 0.05, 0.4, { type: "triangle", g: 0.06, a: 0.002 }); },
    link: c => { note(c, 659.3, 0, 0.25, { type: "triangle", g: 0.08, a: 0.002 }); note(c, 987.8, 0.09, 0.35, { type: "triangle", g: 0.08, a: 0.002 }); },

  let rules = [];

    if (el.closest("nav button, [role=tab], .tabs button")) return "tab";

  }

    try {
      new MutationObserver(ms => { for (const m of ms) { const el = m.target.nodeType === 1 ? m.target : m.target.parentElement; if (!el || !el.closest) continue;

    const row = document.createElement("div"); row.id = "se-row"; row.className = "se-row";
    row.innerHTML = '<span>効果音</span><button type="button" id="se-on" class="se-btn"></button><label class="se-vol">音量 <input id="se-vol" type="range" min="0" max="1" step="0.05"></label>';

    r.addEventListener("input", () => { vol = +r.value; try { localStorage.setItem("se-vol", String(vol)); } catch (e) {} });
    r.addEventListener("change", () => play("done"));
    show();
  }
  return { play, init, mount, soundFor, get on(){ return on; } };
})();
